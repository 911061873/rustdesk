name: 自定义全平台客户端

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: custom-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      custom-client: true
      upload-artifact: true
      publish-release: false
      publish-update-metadata: false
